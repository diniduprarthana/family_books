spring.application.name=Family Books

# Server
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File storage (relative to project working directory)
familybooks.data.directory=data

# Book cover uploads (also enforced in BookCoverStorageService)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Error pages
server.error.whitelabel.enabled=false
server.error.include-message=always

# Logging
logging.level.com.familybooks=INFO
logging.level.org.springframework.security=WARN
