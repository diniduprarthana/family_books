<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body class="site-shell"
      th:attr="data-flash-success=${successMessage}, data-flash-error=${errorMessage}">
<header th:replace="~{layout :: navbar}"></header>
<main class="site-main">
    <section class="page-banner">
        <div class="container">
            <p class="section-eyebrow">Catalogue</p>
            <h1>Book Collection</h1>
            <p>Search the shelves, filter by mood, and find the next story for your home library.</p>
        </div>
    </section>

    <section class="section-compact">
        <div class="container">
            <form method="get" th:action="@{/books}" class="filter-bar">
                <div class="form-group">
                    <label for="q">Search</label>
                    <input class="form-control" id="q" name="q" th:value="${q}" placeholder="Title, author, ISBN"/>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select class="form-control" id="category" name="category">
                        <option value="">All categories</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:selected="${c.id == selectedCategory}"
                                th:text="${c.name}">Fiction</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sort">Sort</label>
                    <select class="form-control" id="sort" name="sort">
                        <option value="title" th:selected="${sort == 'title'}">Title</option>
                        <option value="author" th:selected="${sort == 'author'}">Author</option>
                        <option value="price_asc" th:selected="${sort == 'price_asc'}">Price ↑</option>
                        <option value="price_desc" th:selected="${sort == 'price_desc'}">Price ↓</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-dark">Apply</button>
            </form>

            <p class="book-meta" style="margin-bottom:1.5rem;"
               th:text="${books.size()} + ' title(s) on the shelf'">0 titles</p>

            <div class="book-grid" th:if="${!books.isEmpty()}">
                <article class="book-card" th:each="book : ${books}">
                    <a th:href="@{/books/{id}(id=${book.id})}">
                        <div class="book-cover">
                            <img th:src="${book.coverImage}" th:alt="${book.title}"/>
                        </div>
                        <div class="book-body">
                            <span class="pill" th:text="${book.bookType}">PRINTED</span>
                            <h3 th:text="${book.title}">Title</h3>
                            <p class="book-meta" th:text="${book.author}">Author</p>
                            <p class="book-meta" th:text="${book.availabilityDescription}">Stock</p>
                            <p class="book-price" th:text="'LKR ' + ${#numbers.formatDecimal(book.price, 1, 2)}">LKR 0</p>
                        </div>
                    </a>
                </article>
            </div>
            <div th:if="${books.isEmpty()}" class="alert">No books matched your filters.</div>
        </div>
    </section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
