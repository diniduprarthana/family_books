<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body class="site-shell"
      th:attr="data-flash-success=${successMessage}, data-flash-error=${errorMessage}">
<header th:replace="~{layout :: navbar}"></header>
<main class="site-main section">
    <div class="container" style="max-width:720px;">
        <p class="section-eyebrow">Account</p>
        <h1 class="section-title">My Profile</h1>

        <div style="display:grid;gap:1.5rem;">
            <form th:action="@{/profile/update}" method="post" class="form-panel" style="max-width:none;">
                <h2 style="margin-top:0;">Profile details</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input class="form-control" th:value="${user.username}" disabled/>
                </div>
                <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input class="form-control" id="fullName" name="fullName" th:value="${user.fullName}" required/>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" th:value="${user.email}" required/>
                </div>
                <p class="book-meta">Role: <span th:text="${user.role}">CUSTOMER</span></p>
                <button type="submit" class="btn btn-dark">Save changes</button>
            </form>

            <form th:action="@{/profile/password}" method="post" class="form-panel" style="max-width:none;">
                <h2 style="margin-top:0;">Change password</h2>
                <div class="form-group">
                    <label for="currentPassword">Current password</label>
                    <input class="form-control" type="password" id="currentPassword" name="currentPassword" required/>
                </div>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input class="form-control" type="password" id="newPassword" name="newPassword" required minlength="6"/>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required minlength="6"/>
                </div>
                <button type="submit" class="btn btn-dark">Update password</button>
            </form>

            <form th:action="@{/profile/delete}" method="post" class="form-panel" style="max-width:none;border-color:#a34a3d;">
                <h2 style="margin-top:0;color:#6d2a21;">Delete account</h2>
                <p>This permanently removes your account and associated reviews.</p>
                <button type="submit" class="btn btn-danger" data-confirm="Delete your account permanently?">Delete my account</button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
