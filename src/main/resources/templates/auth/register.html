<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body class="site-shell">
<header th:replace="~{layout :: navbar}"></header>
<main class="site-main">
    <div class="auth-stage">
        <aside class="auth-visual">
            <div>
                <p class="section-eyebrow">Join the library</p>
                <h2>Begin your shelf</h2>
                <p>Create an account to review books and keep your Family Books profile.</p>
            </div>
        </aside>
        <div class="auth-form-wrap">
            <div class="form-panel" style="width:min(100%, 460px);">
                <p class="section-eyebrow">Register</p>
                <h1 style="margin-top:0;font-size:2.4rem;">Create Account</h1>
                <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
                <form th:action="@{/register}" method="post">
                    <div class="form-group">
                        <label for="fullName">Full name</label>
                        <input class="form-control" id="fullName" name="fullName" th:value="${fullName}" required/>
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input class="form-control" id="username" name="username" th:value="${username}" required minlength="3"/>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email" th:value="${email}" required/>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input class="form-control" type="password" id="password" name="password" required minlength="6"/>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required minlength="6"/>
                    </div>
                    <button type="submit" class="btn btn-dark" style="width:100%;">Register</button>
                </form>
                <p style="margin-top:1.25rem;text-align:center;">
                    Already a member? <a th:href="@{/login}" style="color:var(--walnut);text-decoration:underline;">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
