<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body class="site-shell">
<header th:replace="~{layout :: navbar}"></header>
<main class="site-main section">
    <div class="container">
        <div class="form-panel">
            <p class="section-eyebrow">Join the library</p>
            <h1 style="margin-top:0;">Create Account</h1>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label for="fullName">Full name</label>
                    <input class="form-control" id="fullName" name="fullName" th:value="${fullName}" required/>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input class="form-control" id="username" name="username" th:value="${username}" required minlength="3"/>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" th:value="${email}" required/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" required minlength="6"/>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required minlength="6"/>
                </div>
                <button type="submit" class="btn btn-dark" style="width:100%;">Register</button>
            </form>
            <p style="margin-top:1.25rem;text-align:center;">
                Already a member? <a th:href="@{/login}" style="color:var(--walnut);text-decoration:underline;">Sign in</a>
            </p>
        </div>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
