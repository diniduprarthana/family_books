<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body class="site-shell"
      th:attr="data-flash-success=${successMessage}, data-flash-error=${errorMessage}">
<div class="admin-layout">
    <aside th:replace="~{admin/layout-admin :: sidebar}"></aside>
    <main class="admin-content">
        <h1 class="section-title" style="font-size:2.2rem;" th:text="${book != null} ? 'Edit Book' : 'Add Book'">Book</h1>
        <form th:action="${book != null} ? @{/admin/books/{id}(id=${book.id})} : @{/admin/books}"
              method="post" class="form-panel" style="max-width:720px;margin:0;">
            <div class="form-group">
                <label for="title">Title</label>
                <input class="form-control" id="title" name="title" required
                       th:value="${book != null ? book.title : ''}"/>
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input class="form-control" id="author" name="author" required
                       th:value="${book != null ? book.author : ''}"/>
            </div>
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input class="form-control" id="isbn" name="isbn" required
                       th:value="${book != null ? book.isbn : ''}"/>
            </div>
            <div class="form-group">
                <label for="categoryId">Category</label>
                <select class="form-control" id="categoryId" name="categoryId" required>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${book != null and book.categoryId == c.id}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4"
                          th:text="${book != null ? book.description : ''}"></textarea>
            </div>
            <div class="form-group">
                <label for="price">Price (LKR)</label>
                <input class="form-control" type="number" step="0.01" min="0" id="price" name="price" required
                       th:value="${book != null ? book.price : ''}"/>
            </div>
            <div class="form-group">
                <label for="coverImage">Cover image path</label>
                <input class="form-control" id="coverImage" name="coverImage"
                       th:value="${book != null ? book.coverImage : '/images/books/placeholder.jpg'}"/>
            </div>
            <div class="form-group">
                <label for="bookType">Book type</label>
                <select class="form-control" id="bookType" name="bookType">
                    <option value="PRINTED" th:selected="${book == null or book.bookType == 'PRINTED'}">Printed Book</option>
                    <option value="EBOOK" th:selected="${book != null and book.bookType == 'EBOOK'}">E-Book</option>
                </select>
            </div>
            <div id="printedFields">
                <div class="form-group">
                    <label for="stockQuantity">Stock quantity</label>
                    <input class="form-control" type="number" min="0" id="stockQuantity" name="stockQuantity"
                           th:value="${book != null and book.bookType == 'PRINTED' ? book.stockQuantity : 10}"/>
                </div>
                <div class="form-group">
                    <label for="pageCount">Page count</label>
                    <input class="form-control" type="number" min="1" id="pageCount" name="pageCount"
                           th:value="${book != null and book.bookType == 'PRINTED' ? book.pageCount : 200}"/>
                </div>
            </div>
            <div id="ebookFields" style="display:none;">
                <div class="form-group">
                    <label for="digitalFormat">Digital format</label>
                    <input class="form-control" id="digitalFormat" name="digitalFormat"
                           th:value="${book != null and book.bookType == 'EBOOK' ? book.digitalFormat : 'EPUB'}"/>
                </div>
                <div class="form-group">
                    <label for="downloadAccess">Download access</label>
                    <input class="form-control" id="downloadAccess" name="downloadAccess"
                           th:value="${book != null and book.bookType == 'EBOOK' ? book.downloadAccess : 'Immediate'}"/>
                </div>
            </div>
            <div style="display:flex;gap:0.75rem;">
                <button type="submit" class="btn btn-dark">Save book</button>
                <a th:href="@{/admin/books}" class="btn btn-outline" style="color:var(--espresso);">Cancel</a>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
