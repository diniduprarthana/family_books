<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body class="site-shell"
      th:attr="data-flash-success=${successMessage}, data-flash-error=${errorMessage}">
<div class="admin-layout">
    <aside th:replace="~{admin/layout-admin :: sidebar}"></aside>
    <main class="admin-content">
        <h1 class="section-title" style="font-size:2.2rem;">Categories</h1>
        <form th:action="@{/admin/categories}" method="post" class="form-panel" style="max-width:640px;margin:0 0 1.5rem;">
            <h2 style="margin-top:0;">Add category</h2>
            <div class="form-group">
                <label for="name">Name</label>
                <input class="form-control" id="name" name="name" required/>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="2"></textarea>
            </div>
            <button class="btn btn-dark" type="submit">Create</button>
        </form>

        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Books</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}">id</td>
                    <td>
                        <form th:action="@{/admin/categories/{id}(id=${category.id})}" method="post">
                            <input class="form-control" name="name" th:value="${category.name}" required/>
                            <textarea class="form-control" name="description" rows="2" style="margin-top:0.4rem;"
                                      th:text="${category.description}"></textarea>
                            <button class="btn btn-sm btn-dark" style="margin-top:0.4rem;" type="submit">Update</button>
                        </form>
                    </td>
                    <td th:text="${category.description}">desc</td>
                    <td th:text="${bookCounts.get(category.id)}">0</td>
                    <td>
                        <form th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post">
                            <button class="btn btn-sm btn-danger" type="submit"
                                    data-confirm="Delete this category? It will fail if books still reference it.">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
